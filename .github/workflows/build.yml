name: Build ESP32-S3 Firmware

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install PlatformIO and esptool
      run: |
        python -m pip install --upgrade platformio
        python -m pip install esptool

    - name: Build Firmware
      run: pio run

    - name: Merge Binaries with Hash Fix
      run: |
        python -m esptool --chip esp32s3 merge_bin \
          -o .pio/build/esp32-s3-devkitc-1/firmware-factory.bin \
          --flash_mode dio \
          --flash_size 16MB \
          0x0 .pio/build/esp32-s3-devkitc-1/bootloader.bin \
          0x8000 .pio/build/esp32-s3-devkitc-1/partitions.bin \
          0x10000 .pio/build/esp32-s3-devkitc-1/firmware.bin

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32-s3-dsp-firmware
        path: .pio/build/esp32-s3-devkitc-1/firmware-factory.bin
